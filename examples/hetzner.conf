# agentfleet: three Hetzner boxes via the ssh provider.
#
# The ssh provider means you own the machine lifecycle: create the servers with
# `hcloud server create` or the Hetzner console, and agentfleet takes over from
# there. Nothing here needs a Hetzner API token.
#
# Copy to ~/.config/agentfleet/config and edit the marked lines.

AF_NAME=agentfleet
AF_PROVIDER=ssh

# ---------------------------------------------------------------- machines
#
# These names are handed to ssh verbatim, so each one has to resolve. Easiest
# path: join the servers to your tailnet at create time and use their MagicDNS
# names, which is what the AF_TAILNET setting below assumes. Otherwise use their
# public IPs, real DNS names, or Host blocks in ~/.ssh/config.
AF_HOSTS="hz1 hz2 hz3"

# EDIT: the sudo user you created on the servers. Hetzner's Ubuntu images boot
# with root only, so make a real user in the server's cloud-init:
#
#   users:
#     - name: agent
#       groups: sudo
#       sudo: ALL=(ALL) NOPASSWD:ALL
#       shell: /bin/bash
#       ssh_authorized_keys: [ "<contents of ~/.ssh/agentfleet.pub>" ]
#
# Passwordless sudo is not optional: provisioning installs packages, a swapfile
# and an sshd drop-in.
AF_USER=agent
AF_KEY="$HOME/.ssh/agentfleet"

# Path mirroring. With AF_PROVIDER=ssh, agentfleet does NOT create the account,
# so this must be the user's REAL home directory on those servers. Set the
# cloud-init above to `homedir: /Users/you` if you want your laptop's absolute
# paths to resolve identically on both sides; otherwise leave this empty and the
# default /home/agent applies.
AF_HOME=""

# ---------------------------------------------------------------- the agent
AF_AGENT=claude
AF_SESSION=main

# Empty derives $AF_HOME/work, so it follows AF_USER instead of going stale the
# day you rename the account.
AF_WORKDIR=""
AF_REPO="git@github.com:you/your-repo.git"
AF_REPO_BRANCH=main

# ---------------------------------------------------------------- syncing
#
# One way, laptop -> servers, on every sync. Credentials are refused here on
# purpose; they go through AF_SECRETS below.
AF_SYNC_PATHS="
.claude/CLAUDE.md
.claude/agents
.claude/commands
.claude/skills
.gitconfig
"

# Prove the agent still starts after its config was overwritten. A failure is
# reported loudly and the machine is retried on the next run.
AF_SYNC_HEALTHCHECK="claude --version"

# Catch the failure mode where a synced shell rc strips the key the agent
# authenticates with. Names, not values.
AF_REQUIRED_ENV=""

# Off: only work an agent commits itself travels home. Read docs/security.md
# before turning this on.
AF_AUTOCOMMIT=0

# Uncomment to distribute API keys. "name|path", $HOME-relative on both ends,
# sent over ssh at mode 600, and only by an explicit `agentfleet secrets push`.
# AF_SECRETS="
# anthropic|.config/anthropic/key
# "

# ---------------------------------------------------------------- networking
#
# Tailnet first. A Hetzner firewall rule pinned to your current public IP stops
# answering the moment you change wifi, and all three servers go unreachable
# while being perfectly healthy.
AF_TAILNET=auto
AF_TS_AUTHKEY_FILE="$HOME/.config/agentfleet/tailscale.key"

AF_DASH_PORT=8788
AF_DASH_BIND=tailnet

# ---------------------------------------------------------------- machine sizing
#
# Sized for CCX33 (8 vCPU, 32GB). Swap matching RAM turns an out-of-memory event
# from "rebuild the server" into "ssh in and kill it". Roughly one subagent per
# 3GB is what survives in practice; leave the cap empty and each machine works it
# out from its own RAM.
AF_SWAP_GB=32
AF_SUBAGENT_CAP=10

AF_NODE_VERSION=22
AF_PKG_EXTRA="htop fd-find"
AF_NPM_EXTRA=""

# ---------------------------------------------------------------- status
#
# Carried to the servers by `agentfleet provision`, not by `sync` - change
# anything here and re-provision (it is idempotent).
AF_STATUS_INTERVAL=15

# Optional one-line prose summary per machine. Everything else on the dashboard
# is deterministic and works with this left at none. The key file path is on the
# SERVER; get it there with `agentfleet secrets push`.
AF_SUMMARY_PROVIDER=none
# AF_SUMMARY_PROVIDER=anthropic
# AF_SUMMARY_KEY_FILE=".config/anthropic/key"
AF_SUMMARY_MIN_INTERVAL=60

# ---------------------------------------------------------------- optional
AF_BROWSER=0
AF_MAC_CHROME=0
AF_DROP_SRC="$HOME/Desktop"
