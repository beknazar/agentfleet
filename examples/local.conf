# agentfleet: two machines on the LAN, no cloud account and no tailnet.
#
# A spare workstation and a homelab box. Both are already reachable by name from
# this laptop, both run Ubuntu, both have your ssh key. That is the whole setup.
#
# Copy to ~/.config/agentfleet/config and edit the marked lines.

AF_NAME=agentfleet
AF_PROVIDER=ssh

# ---------------------------------------------------------------- machines
#
# Resolved by mDNS here (.local), so nothing else has to know about them. An
# /etc/hosts entry or a Host block in ~/.ssh/config works the same way.
AF_HOSTS="nuc attic"

# EDIT: the login user, which needs passwordless sudo on both machines:
#   echo "$USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/agentfleet
AF_USER=agent
AF_KEY="$HOME/.ssh/agentfleet"

# Real home directory of AF_USER on those machines. With AF_PROVIDER=ssh nothing
# creates the account, so this has to match what is actually there.
AF_HOME="/home/agent"

# ---------------------------------------------------------------- the agent
AF_AGENT=codex
AF_SESSION=main

# Empty derives $AF_HOME/work.
AF_WORKDIR=""
AF_REPO="git@github.com:you/your-repo.git"
AF_REPO_BRANCH=main

# ---------------------------------------------------------------- syncing
AF_SYNC_PATHS="
.codex/AGENTS.md
.codex/prompts
.gitconfig
"
AF_AUTOCOMMIT=0

# ---------------------------------------------------------------- networking
#
# No tailnet on a LAN. Consequences, both intended:
#   * addresses come straight from AF_HOSTS
#   * the machines' web terminal binds to loopback instead of a tailnet
#     interface, so reach it with: ssh -L 7681:localhost:7681 nuc
#   * the dashboard has no tailnet address to bind to, hence AF_DASH_BIND=local
AF_TAILNET=off

AF_DASH_PORT=8788
AF_DASH_BIND=local

# Same building, so a machine that has not answered in three seconds is not
# thinking, it is down.
AF_PROBE_TIMEOUT=4

# ---------------------------------------------------------------- machine sizing
#
# 16GB boxes. The swapfile is what keeps a runaway fan-out from freezing the
# machine hard enough that sshd cannot fork, which on hardware in your house
# means walking over to it.
AF_SWAP_GB=16
AF_SUBAGENT_CAP=5

AF_NODE_VERSION=22
AF_PKG_EXTRA=""

# ---------------------------------------------------------------- status
#
# Slower than the default: these are not billed by the hour and nothing here is
# urgent enough to poll every 15 seconds.
AF_STATUS_INTERVAL=30
AF_SUMMARY_PROVIDER=none

# Memory dot goes red earlier on a small machine than on a 64GB cloud box.
AF_DASH_MEM_PCT=80

# ---------------------------------------------------------------- optional
AF_BROWSER=0
AF_MAC_CHROME=0

# Screenshot inbox: `agentfleet drop` with no argument sends the newest file
# here to every machine and prints the path that works there.
AF_DROP_SRC="$HOME/Pictures/Screenshots"

# Clipboard bridge: text copied inside a remote tmux lands on this laptop. It has
# no authentication, so it is only reasonable on a network you control. Run the
# laptop half yourself: agent/clipboard.sh bridge
# AF_CLIP_HOST="laptop.local"
# AF_CLIP_BIND="192.168.1.20"
AF_CLIP_PORT=8899
